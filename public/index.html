<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>UnifiedAI</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{
  margin:0;background:#050506;color:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background-image:radial-gradient(ellipse 55% 30% at 50% 104%,rgba(110,114,160,.13),transparent 85%);
  background-attachment:fixed;
}
.app{height:100dvh;display:flex;flex-direction:column;background:transparent}
header{
  height:65px;flex-shrink:0;display:flex;align-items:center;padding:0 25px;
  border-bottom:1px solid rgba(255,255,255,.12);font-size:20px;font-weight:600;
  background:rgba(31,32,38,.45);backdrop-filter:blur(26px) saturate(150%);
  -webkit-backdrop-filter:blur(26px) saturate(150%);
  box-shadow:0 8px 35px rgba(0,0,0,.18)
}
.chat{flex:1;min-height:0;overflow-y:auto;padding:25px 20px;scrollbar-color:rgba(255,255,255,.22) transparent}
.chat-inner{max-width:800px;margin:auto;min-height:100%}
.welcome{min-height:65vh;display:flex;align-items:center;justify-content:center;text-align:center}
.welcome h1{font-size:32px;font-weight:500}
.message-row{display:flex;flex-direction:column;margin-bottom:22px}
.message-row.user{align-items:flex-end}
.message-row.ai{align-items:flex-start}
.message{
  max-width:85%;font-size:var(--chat-font-size,15px);line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;
  text-align:start;unicode-bidi:plaintext
}
.user .message{
  background:#0b6cff;border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px rgba(255,255,255,.07),0 8px 24px rgba(0,0,0,.18);
  backdrop-filter:blur(20px) saturate(130%);-webkit-backdrop-filter:blur(20px) saturate(130%);
  padding:12px 18px;border-radius:20px
}
.ai .message{padding:8px 0}
.message-image{
  display:block;max-width:min(100%,640px);max-height:620px;object-fit:contain;
  border-radius:18px;border:1px solid rgba(255,255,255,.13);
  box-shadow:0 12px 40px rgba(0,0,0,.38)
}
.user-attachment{
  width:180px;max-height:180px;object-fit:cover;border-radius:16px;margin-bottom:8px;
  border:1px solid rgba(255,255,255,.14)
}
.message-actions{display:flex;gap:4px;margin-top:3px;opacity:.72;transition:opacity .15s}
.message-row.ai:hover .message-actions{opacity:1}
.action-btn{
  width:30px;height:30px;padding:0;border-radius:10px;border:1px solid transparent;
  background:transparent;color:rgba(255,255,255,.65);font-size:14px;cursor:pointer;
  display:grid;place-items:center
}
.action-btn:hover,.action-btn.active{
  color:#fff;background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.10)
}
.bottom{
  flex-shrink:0;padding:15px 20px 18px;
  background:linear-gradient(to top,rgba(5,5,6,.97) 75%,rgba(5,5,6,.55));
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)
}
.input-container{max-width:800px;margin:auto}
.composer{
  background:rgba(53,54,62,.48);border:1px solid rgba(255,255,255,.19);border-radius:25px;
  box-shadow:inset 0 1px rgba(255,255,255,.10),0 12px 38px rgba(0,0,0,.40);
  backdrop-filter:blur(30px) saturate(155%);-webkit-backdrop-filter:blur(30px) saturate(155%);
  overflow:visible
}
.composer:focus-within{border-color:rgba(255,255,255,.32)}
.attachment-preview{display:none;padding:12px 12px 0;position:relative;width:max-content}
.attachment-preview.show{display:block}
.attachment-preview img{width:92px;height:92px;object-fit:cover;border-radius:14px;border:1px solid rgba(255,255,255,.15)}
.remove-attachment{
  position:absolute;top:6px;right:5px;width:24px;height:24px;border-radius:50%;border:0;
  background:rgba(15,15,16,.86);color:#fff;font-size:14px;cursor:pointer
}
form{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;background:transparent}
textarea{
  flex:1;min-width:0;min-height:36px;max-height:150px;background:transparent;border:none;outline:none;
  resize:none;color:white;font:inherit;padding:8px;overflow-y:auto
}
textarea::placeholder{color:#929297}
.circle-btn,.model-button{
  border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.10);color:#f3f3f5;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);cursor:pointer;flex-shrink:0
}
.circle-btn{width:38px;height:38px;border-radius:50%;font-size:20px;display:grid;place-items:center}
.circle-btn:hover,.model-button:hover{background:rgba(255,255,255,.18)}
.image-mode-button{height:38px;padding:0 10px;border-radius:17px;background:rgba(255,255,255,.09);color:#f4f4f8;border:1px solid rgba(255,255,255,.16);cursor:pointer;white-space:nowrap;font-size:12px}
.image-mode-button.active{background:rgba(126,106,208,.32);border-color:rgba(171,151,255,.75);color:white}
@media(max-width:600px){.image-mode-button{padding:0 7px;font-size:11px}}
#sendButton{background:#fff;color:#111;border:0;box-shadow:0 2px 14px rgba(255,255,255,.13)}
#sendButton:disabled{opacity:.4;cursor:not-allowed}
.model-picker{position:relative;flex-shrink:0}
.model-button{width:auto;height:38px;padding:0 12px;border-radius:18px;font-size:12px;white-space:nowrap}
.model-menu{
  position:absolute;left:0;bottom:48px;width:min(260px,82vw);max-height:min(390px,55vh);
  display:none;overflow-y:auto;padding:7px;border:1px solid rgba(255,255,255,.18);border-radius:16px;
  background:rgba(33,34,41,.78);box-shadow:inset 0 1px rgba(255,255,255,.10),0 18px 48px rgba(0,0,0,.60);
  backdrop-filter:blur(36px) saturate(155%);-webkit-backdrop-filter:blur(36px) saturate(155%);z-index:100
}
.model-menu.open{display:block}
.model-menu button{
  width:100%;height:auto;display:block;padding:10px 12px;margin:2px 0;border:0;border-radius:10px;
  background:transparent;color:#eee;text-align:left;font-size:13px;cursor:pointer
}
.model-menu button:hover{background:rgba(255,255,255,.14)}
.status{text-align:center;font-size:12px;color:rgba(245,245,245,.48);margin-top:10px}
.watermark{text-align:center;font-size:11px;color:rgba(245,245,245,.30);margin-top:7px;pointer-events:none}
.hidden-file{display:none}
@media(max-width:600px){
  header{padding:0 15px}.chat{padding:20px 12px}.bottom{padding:10px}.message{max-width:95%}
  .welcome h1{font-size:27px}.model-button{max-width:100px;overflow:hidden;text-overflow:ellipsis}
}
@media(prefers-reduced-motion:no-preference){
  .model-menu{animation:glass-in .16s ease-out}
  @keyframes glass-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
}

/* Render AI Markdown as rich content while keeping the user bubble plain text. */
.ai .message {
  width: min(100%, 760px);
  max-width: 100%;
  white-space: normal;
  line-height: 1.85;
  unicode-bidi: normal;
  font-size: var(--chat-font-size,15px);
}
.ai .message :first-child { margin-top: 0; }
.ai .message :last-child { margin-bottom: 0; }
.ai .message p { margin: 0 0 13px; }
.ai .message h1, .ai .message h2, .ai .message h3,
.ai .message h4, .ai .message h5, .ai .message h6 {
  color: #fff; font-weight: 750; line-height: 1.5;
  margin: 21px 0 10px; overflow-wrap: anywhere;
}
.ai .message h1 { font-size: 1.52rem; }
.ai .message h2 { font-size: 1.34rem; }
.ai .message h3 { font-size: 1.15rem; }
.ai .message h4, .ai .message h5, .ai .message h6 { font-size: 1rem; }
.ai .message strong { font-weight: 800; color: #fff; }
.ai .message em { color: #e3e3eb; }
.ai .message ul, .ai .message ol {
  padding-inline-start: 25px; margin: 9px 0 15px;
}
.ai .message li { margin: 5px 0; padding-inline-start: 3px; }
.ai .message li > p { margin-bottom: 7px; }
.ai .message blockquote {
  padding: 10px 15px; margin: 14px 0;
  border-inline-start: 3px solid rgba(168,184,255,.55);
  border-radius: 12px; background: rgba(255,255,255,.055);
  color: #dfe2eb;
}
.ai .message hr { border: 0; border-top: 1px solid rgba(255,255,255,.14); margin: 19px 0; }
.ai .message a { color: #a6c7ff; text-decoration: underline; text-underline-offset: 3px; }
.ai .message a:hover { color: #d4e4ff; }
.ai .message :not(pre) > code {
  font: .91em Consolas, "SFMono-Regular", monospace;
  background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.08);
  border-radius: 6px; padding: 2px 5px;
  direction: ltr; unicode-bidi: isolate;
}
.ai .message pre {
  background: rgba(13,15,21,.88); border: 1px solid rgba(255,255,255,.12);
  border-radius: 15px; padding: 15px; margin: 14px 0;
  overflow-x: auto; max-width: 100%; white-space: pre;
  direction: ltr; text-align: left; unicode-bidi: isolate;
}
.ai .message pre code {
  font: 13px/1.65 Consolas, "SFMono-Regular", monospace;
  background: none; padding: 0; white-space: pre;
}
.ai .message table {
  width: 100%; border-collapse: collapse; margin: 13px 0;
  display: block; overflow-x: auto; max-width: 100%;
}
.ai .message th, .ai .message td {
  border: 1px solid rgba(255,255,255,.16); padding: 8px 10px;
  text-align: start; white-space: normal;
}
.ai .message th { background: rgba(255,255,255,.09); font-weight: 750; }
.ai .message img { max-width: 100%; border-radius: 12px; }
.ai .message [dir="ltr"] { unicode-bidi: isolate; }


/* Multiple file attachments: glass chips, thumbnails and remove controls. */
.attachment-preview{display:none;width:100%;padding:10px 12px 0;position:static;flex-wrap:wrap;gap:8px}
.attachment-preview.show{display:flex}
.file-chip,.uploaded-file{
  display:inline-flex;gap:8px;align-items:center;max-width:100%;padding:7px 9px;
  border-radius:13px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.09);font-size:12px;overflow-wrap:anywhere
}
.file-chip img{width:36px;height:36px;object-fit:cover;border-radius:7px}
.file-chip span{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-remove{background:rgba(255,255,255,.12);color:white;border:0;border-radius:50%;
  width:22px;height:22px;cursor:pointer;font-size:16px;flex-shrink:0}
.user .uploaded-file{margin:3px 0}

/* Sidebar — client-side guest workspace, never a claim of real account sync. */
.app{display:block;height:100dvh}
.workspace{height:100%;display:flex;min-width:0}
.main-pane{order:1;display:flex;flex:1;min-width:0;min-height:0;flex-direction:column}
.sidebar{
  order:2;width:270px;flex:0 0 270px;display:flex;flex-direction:column;min-height:0;overflow:hidden;
  border-inline-start:1px solid rgba(255,255,255,.13);border-inline-end:0;
  background:rgba(24,24,29,.73);backdrop-filter:blur(32px) saturate(145%);
  -webkit-backdrop-filter:blur(32px) saturate(145%);padding:17px 11px 13px;
  transition:width .22s ease,flex-basis .22s ease,padding .22s ease,opacity .18s ease,border-color .22s ease;
}
.workspace.sidebar-collapsed .sidebar{
  width:0;flex-basis:0;padding:0;border-color:transparent;opacity:0;pointer-events:none;
}
.side-heading{display:flex;align-items:center;justify-content:space-between;padding:3px 10px 17px;gap:5px}
.side-heading strong{font-size:19px;letter-spacing:-.5px}
.sidebar-toggle{display:inline-flex;align-items:center;justify-content:center;font:inherit;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.08);
  color:#f6f6f8;border-radius:12px;cursor:pointer;width:36px;height:36px;flex-shrink:0}
.side-action{width:100%;text-align:start;padding:12px 13px;display:flex;align-items:center;gap:12px;
  background:transparent;border:0;border-radius:12px;color:#f4f4f5;font:inherit;font-size:13px;cursor:pointer}
.side-action:hover{background:rgba(255,255,255,.09)}
.side-action.primary{background:rgba(255,255,255,.095);border:1px solid rgba(255,255,255,.09);font-weight:650}
.side-section-title{padding:19px 11px 9px;color:#9999a4;font-size:11px;font-weight:650;letter-spacing:.03em}
.chat-search{width:calc(100% - 10px);margin:4px 5px 2px;display:none;border-radius:11px;border:1px solid rgba(255,255,255,.17);
  background:rgba(8,8,10,.5);color:#fff;padding:11px;font:inherit;font-size:13px;outline:none}
.chat-search.show{display:block}
.chat-list{overflow-y:auto;min-height:0;flex:1;scrollbar-color:rgba(255,255,255,.18) transparent}
.chat-entry{display:flex;gap:3px;align-items:center;margin:2px 0;border-radius:12px;min-width:0}
.chat-entry.active{background:rgba(255,255,255,.11)}
.chat-select{min-width:0;flex:1;background:none;border:0;color:#d4d4d9;text-align:start;font:inherit;font-size:13px;
  padding:10px 5px 10px 11px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-entry.active .chat-select{color:#fff;font-weight:650}
.chat-option{flex-shrink:0;width:24px;height:27px;background:transparent;color:#9999a5;border:0;border-radius:8px;cursor:pointer;font-size:13px}
.chat-option:hover{color:#fff;background:rgba(255,255,255,.13)}
.chat-empty{padding:13px 11px;color:#858591;font-size:12px;line-height:1.7}
.side-footer{border-top:1px solid rgba(255,255,255,.10);padding-top:8px;margin-top:8px}
.guest-pill{margin:8px 9px 3px;color:#9898a5;font-size:11px}
.main-pane>header{gap:12px;justify-content:flex-start}
.main-pane>header .sidebar-toggle{font-size:22px;order:2;margin-left:auto}
.sidebar-backdrop{display:none}
.dialog-mask{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.69);display:none;
  align-items:center;justify-content:center;padding:15px;backdrop-filter:blur(6px)}
.dialog-mask.open{display:flex}
.dialog{width:min(450px,100%);background:rgba(33,33,40,.96);border:1px solid rgba(255,255,255,.2);
  box-shadow:0 30px 90px rgba(0,0,0,.6);border-radius:22px;padding:23px;color:#fff;line-height:1.75;direction:rtl}
.dialog h2{font-size:21px;margin:0 0 10px}.dialog p{color:#bdbdc8;font-size:13px;margin:0 0 17px}
.dialog label{font-size:13px;display:block;margin-bottom:6px}
.dialog input[type=text]{width:100%;font:inherit;background:#17171b;border:1px solid #50505c;color:#fff;
  outline:none;padding:10px;border-radius:10px;direction:auto}
.dialog input[type=range]{width:100%}
.dialog-actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
.dialog-button{font:inherit;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.16);
  padding:9px 15px;border-radius:11px;cursor:pointer}
.dialog-button.primary{background:#f2f2f6;color:#17171b;font-weight:700}
.dialog-button.danger{border-color:#c06a6a;color:#ffc2c2}
.dialog-note{font-size:11px!important;margin-top:10px!important}
@media(max-width:850px){
 .workspace.sidebar-collapsed .sidebar{width:min(290px,86vw);flex-basis:auto;padding:17px 11px 13px;border-inline-start:1px solid rgba(255,255,255,.13);opacity:1;pointer-events:auto}
 .sidebar{position:fixed;z-index:410;top:0;bottom:0;right:0;left:auto;width:min(290px,86vw);max-width:min(290px,86vw);
   transform:translateX(105%);transition:transform .22s ease;box-shadow:-20px 0 70px rgba(0,0,0,.4)}
 .sidebar.open{transform:translateX(0)}
 .sidebar-backdrop.open{display:block;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.52)}
}
@media(prefers-reduced-motion:reduce){.sidebar{transition:none}}


/* UnifiedAI appearance settings: applied to every main surface, not only body. */
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="light"] body{background:#f4f5f9;color:#161923;background-image:radial-gradient(ellipse at 45% 100%,rgba(145,159,214,.20),transparent 80%)}
:root[data-theme="light"] .app{background:transparent;color:#161923}
:root[data-theme="light"] header{background:rgba(249,250,254,.76);border-color:rgba(37,45,75,.13);box-shadow:0 8px 35px rgba(34,40,65,.06)}
:root[data-theme="light"] .sidebar{background:rgba(249,250,254,.83);border-color:rgba(37,45,75,.13)}
:root[data-theme="light"] .side-action{color:#252938}
:root[data-theme="light"] .side-action:hover,:root[data-theme="light"] .side-action.primary,:root[data-theme="light"] .chat-entry.active{background:rgba(60,77,120,.09)}
:root[data-theme="light"] .side-section-title,:root[data-theme="light"] .guest-pill,:root[data-theme="light"] .chat-empty{color:#6b7180}
:root[data-theme="light"] .chat-select{color:#343949}
:root[data-theme="light"] .chat-entry.active .chat-select,:root[data-theme="light"] .ai .message strong,:root[data-theme="light"] .ai .message h1,:root[data-theme="light"] .ai .message h2,:root[data-theme="light"] .ai .message h3,:root[data-theme="light"] .ai .message h4,:root[data-theme="light"] .ai .message h5,:root[data-theme="light"] .ai .message h6{color:#151821}
:root[data-theme="light"] .chat-option,:root[data-theme="light"] .side-section-title{color:#6d7384}
:root[data-theme="light"] .bottom{background:linear-gradient(to top,rgba(244,245,249,.98) 70%,rgba(244,245,249,.65))}
:root[data-theme="light"] .composer{background:rgba(255,255,255,.85);border-color:rgba(45,54,88,.15);box-shadow:inset 0 1px #fff,0 12px 38px rgba(32,42,69,.09)}
:root[data-theme="light"] textarea,:root[data-theme="light"] .chat-search,:root[data-theme="light"] .dialog input[type=text]{color:#202431}
:root[data-theme="light"] textarea::placeholder{color:#8a8e9c}
:root[data-theme="light"] .model-button,:root[data-theme="light"] .circle-btn,:root[data-theme="light"] .sidebar-toggle,:root[data-theme="light"] .image-mode-button{background:rgba(48,60,98,.08);border-color:rgba(48,60,98,.13);color:#262c3d}
:root[data-theme="light"] #sendButton{background:#252a39;color:#fff}
:root[data-theme="light"] .model-menu,:root[data-theme="light"] .dialog{background:rgba(255,255,255,.97);border-color:rgba(37,45,75,.16);color:#252a39;box-shadow:0 18px 48px rgba(32,42,69,.15)}
:root[data-theme="light"] .model-menu button,:root[data-theme="light"] .dialog p,:root[data-theme="light"] .dialog label{color:#333b4d}
:root[data-theme="light"] .model-menu button:hover,:root[data-theme="light"] .dialog-button,:root[data-theme="light"] .file-chip,:root[data-theme="light"] .uploaded-file{background:rgba(42,58,100,.08);color:#30384a;border-color:rgba(42,58,100,.13)}
:root[data-theme="light"] .dialog-button.primary{background:#252a39;color:white}
:root[data-theme="light"] .dialog-button.danger{color:#b83232}
:root[data-theme="light"] .user .message{background:#0b6cff;color:#fff;border-color:rgba(11,108,255,.22);box-shadow:0 8px 25px rgba(11,108,255,.16)}
:root[data-theme="light"] .ai .message{color:#212633}
:root[data-theme="light"] .ai .message em{color:#4d566b}
:root[data-theme="light"] .ai .message blockquote,:root[data-theme="light"] .ai .message :not(pre)>code,:root[data-theme="light"] .ai .message th{background:rgba(51,69,112,.07);color:#2a3347}
:root[data-theme="light"] .ai .message pre{background:#e9edf6;color:#202636;border-color:rgba(45,57,88,.16)}
:root[data-theme="light"] .ai .message a{color:#2359b7}
:root[data-theme="light"] .ai .message td,:root[data-theme="light"] .ai .message th{border-color:rgba(43,57,92,.17)}
:root[data-theme="light"] .action-btn{color:#667085}
:root[data-theme="light"] .action-btn:hover,:root[data-theme="light"] .action-btn.active{color:#20283b;background:rgba(42,58,100,.09)}
:root[data-theme="light"] .status,:root[data-theme="light"] .watermark{color:#737b8d}
:root[data-theme="light"] .chat-search,:root[data-theme="light"] .dialog input[type=text]{background:rgba(241,243,248,.9);border-color:rgba(37,45,75,.16)}
:root[data-theme="light"] .side-footer{border-color:rgba(37,45,75,.13)}
.workspace{direction:ltr}
.sidebar,.dialog{direction:inherit}
:root[dir="rtl"] .sidebar,:root[dir="rtl"] .dialog{direction:rtl}
:root[dir="ltr"] .sidebar,:root[dir="ltr"] .dialog{direction:ltr}

/* Controls inside the settings dialog. */
.settings-choice{width:100%;padding:10px 12px;margin:3px 0 15px;border-radius:12px;border:1px solid rgba(128,128,140,.28);background:rgba(120,120,140,.11);color:inherit;font:inherit;cursor:pointer}
.settings-label{margin:11px 0 5px!important;font-weight:650}


/* Isolated scripted demonstration. No API calls and no chat history changes. */
.demo-nav{color:#d6d2ff}
.demo-overlay{position:fixed;inset:0;z-index:550;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.77);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.demo-overlay.visible{display:flex}
.demo-panel{width:min(800px,100%);max-height:min(840px,94dvh);overflow:auto;background:linear-gradient(145deg,rgba(35,36,47,.98),rgba(14,15,23,.98));border:1px solid rgba(190,184,255,.23);border-radius:25px;box-shadow:0 35px 115px rgba(0,0,0,.56);padding:clamp(18px,4vw,32px);color:#f5f4ff;direction:rtl}
.demo-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.demo-eyebrow{font-size:12px;letter-spacing:.03em;color:#c4baff;font-weight:700}

.demo-start:hover{transform:translateY(-1px)}

.workspace{isolation:isolate}

   Backdrop blur is only visible where there is real content/texture behind it. */
:root{--chat-font-size:17px;--glass-motion:cubic-bezier(.2,.8,.2,1)}
body{background:#0b0c10;background-image:radial-gradient(circle at 21% 17%,rgba(173,181,202,.12) 0%,transparent 29%),radial-gradient(circle at 82% 73%,rgba(150,155,175,.10) 0%,transparent 32%),linear-gradient(155deg,#0c0d12,#17191f 55%,#0d0e13);background-attachment:fixed}
.main-pane{background:transparent}

async function copyImage(dataUrl){
  try{

}

// Standalone, safe Markdown fallback: works even when CDN scripts are blocked.
// Only create trusted HTML elements; model text is always inserted as text nodes.
function renderFallbackMarkdown(bubble, source){
  const lines = source.replace(/\r\n?/g, "\n").split("\n");
  let list = null;
  let code = null;
  let paragraph = null;

  function inline(parent, value){
    const pattern = /(`[^`\n]+`|\*\*[^*\n]+\*\*|__[^_\n]+__|(?<!\*)\*[^*\n]+\*(?!\*)|(?<!_)_[^_\n]+_(?!_))/g;
    let last = 0;
    for(const match of value.matchAll(pattern)){
      parent.append(document.createTextNode(value.slice(last, match.index)));
      const part = match[0];
      const strong = part.startsWith("**") || part.startsWith("__");
      const tag = part.startsWith("`") ? "code" : strong ? "strong" : "em";
      const node = document.createElement(tag);
      node.textContent = part.slice(strong ? 2 : 1, strong ? -2 : -1);
      parent.append(node);
      last = match.index + part.length;
    }
    parent.append(document.createTextNode(value.slice(last)));
  }

  function block(tag, content){
    const node = document.createElement(tag);
    node.setAttribute("dir", "auto");
    inline(node, content);
    bubble.append(node);
    return node;
  }

  for(const line of lines){
    const trimmed = line.trim();
    if(/^```/.test(trimmed)){
      list = null;
      paragraph = null;
      if(code){
        code = null;
      }else{
        const pre = document.createElement("pre");
        code = document.createElement("code");
        pre.append(code);
        bubble.append(pre);
      }
      continue;
    }
    if(code){
      code.textContent += (code.textContent ? "\n" : "") + line;
      continue;
    }
    if(!trimmed){
      list = null;
      paragraph = null;
      continue;
    }
    const heading = line.match(/^\s{0,3}(#{1,6})\s+(.+)$/);
    if(heading){
      list = null;
      paragraph = null;
      block("h" + heading[1].length, heading[2]);
      continue;
    }
    if(/^\s{0,3}(?:---+|\*\*\*+)\s*$/.test(line)){
      list = null;
      paragraph = null;
      bubble.append(document.createElement("hr"));
      continue;
    }
    const item = line.match(/^\s*(?:([-*+])|(\d+)\.)\s+(.+)$/);
    if(item){
      paragraph = null;
      const kind = item[2] ? "ol" : "ul";
      if(!list || list.tagName.toLowerCase() !== kind){
        list = document.createElement(kind);
        bubble.append(list);
      }
      const li = document.createElement("li");
      li.setAttribute("dir", "auto");
      inline(li, item[3]);
      list.append(li);
      continue;
    }
    list = null;
    if(/^\s*>\s?/.test(line)){
      paragraph = null;
      block("blockquote", line.replace(/^\s*>\s?/, ""));
      continue;
    }
    if(!paragraph){
      paragraph = block("p", line);
    }else{
      paragraph.append(document.createElement("br"));
      inline(paragraph, line);
    }
  }
}

// Markdown rendered with Marked + DOMPurify when available; fallback requires no CDN.
function renderAssistantMessage(bubble, text){
  bubble.setAttribute("dir", "auto");
  const source = String(text ?? "");
  bubble.replaceChildren();
  bubble.style.whiteSpace = "normal";
  if(typeof marked === "undefined" || typeof DOMPurify === "undefined"){
    renderFallbackMarkdown(bubble, source);
    return;
  }
  try{
    const parsed = marked.parse(source, {gfm:true, breaks:true});
    bubble.innerHTML = DOMPurify.sanitize(parsed, {
      USE_PROFILES: {html:true},
      FORBID_TAGS: ["style","script","iframe","object","embed","form","input","button"]
    });
  }catch(error){
    console.warn("Markdown renderer fallback:", error);
    bubble.replaceChildren();
    renderFallbackMarkdown(bubble, source);
    return;
  }
  bubble.querySelectorAll("a").forEach(link => {
    const url = link.getAttribute("href") || "";
    if(!/^https?:\/\//i.test(url) && !/^mailto:/i.test(url)){
      link.removeAttribute("href");
    }else{
      link.target = "_blank";
      link.rel = "noopener noreferrer nofollow";
    }
  });
  bubble.querySelectorAll("p,li,h1,h2,h3,h4,h5,h6,blockquote,td,th").forEach(el => el.setAttribute("dir", "auto"));
}

// Prefer the actual backend identity: the selected model can differ after failover.
function respondingModel(data){
  if(!data || typeof data !== "object") return null;
  const exact=String(data.actual_model || "").toLowerCase();
  const provider=String(data.provider || "");
  const display=String(data.display_name || "");
  const active=String(data.active_model || "");
  const raw=display || exact || active;
  if(!raw) return null;
  const key=(raw+" "+provider).toLowerCase();
  let name=display || raw;
  if(key.includes("gpt-oss")) name="GPT-OSS 120B";
  else if(key.includes("gemma")) name="Gemma";
  else if(key.includes("glm")) name="GLM 4.7 Flash";
  else if(key.includes("cohere") || key.includes("command")) name="Command A+";
  else if(key.includes("mistral")) name="Mistral Small";
  else if(key.includes("gemini")) name="Gemini";
  // A router-internal id isn't a user-facing model name. Avoid a false attribution.
  else if(/^Model [A-Z]$/i.test(name)) name="UnifiedAI";
  return {name:name.slice(0,80),provider:provider.slice(0,50)};
}

function addAssistantMessage({text="", imageUrl=null, regeneratePayload=null, conversationIndex=null, model=null}){
  welcome.style.display = "none";
  const row = document.createElement("div");
  row.className = "message-row ai";
  updateRespondingLabel(row,model);

  if(imageUrl){
    const img = document.createElement("img");
    img.className = "message-image";
    img.src = imageUrl;
    img.alt = "Generated image";
    row.appendChild(img);
  }

  if(text){
    const bubble = document.createElement("div");
    bubble.className = "message";
    renderAssistantMessage(bubble, text);
    row.appendChild(bubble);
  }

  const actions = document.createElement("div");
  actions.className = "message-actions";

  const copyBtn = makeActionButton("⧉", "Copy", async ()=>{
    if(imageUrl){
      const ok = await copyImage(imageUrl);
      if(!ok) await navigator.clipboard.writeText(text || "Generated image");
    }else{
      await navigator.clipboard.writeText(text);
    }
    copyBtn.textContent = "✓";
    setTimeout(()=>copyBtn.textContent="⧉",900);
  });

  const likeBtn = makeActionButton("♡", "Like", ()=>{
    likeBtn.classList.toggle("active");
    likeBtn.textContent = likeBtn.classList.contains("active") ? "♥" : "♡";
  });

  const downloadBtn = makeActionButton("↓", "Download", ()=>{
    if(imageUrl) downloadData(imageUrl, "UnifiedAI-image." + ((imageUrl.match(/^data:image\/(png|webp|jpeg)/)||[])[1] || "jpeg").replace("jpeg","jpg"));
    else downloadText(text);
  });

  const regenBtn = makeActionButton("↻", "Regenerate", async ()=>{
    if(!regeneratePayload || regenBtn.disabled) return;
    regenBtn.disabled = true;
    status.textContent = "UnifiedAI is regenerating...";
    try{
      const result = await callBackend(regeneratePayload);
      row.querySelectorAll(".message,.message-image").forEach(el=>el.remove());
      const responder=respondingModel(result);
      updateRespondingLabel(row,responder);
      if(result.type === "image"){
        const img = document.createElement("img");
        img.className = "message-image";
        img.src = result.image_data_url;
        img.alt = "Generated image";
        row.insertBefore(img, actions);
        imageUrl = result.image_data_url;
        text = result.answer || "";
      }else{
        const bubble = document.createElement("div");
        bubble.className = "message";
        renderAssistantMessage(bubble, result.answer);
        row.insertBefore(bubble, actions);
        text = result.answer;
        imageUrl = null;
        if(Number.isInteger(conversationIndex) && conversation[conversationIndex]){
          conversation[conversationIndex].content = result.answer;
          // Transcript alternates user/assistant for saved successful text turns.
          const historyAssistant = historyEntries.filter(e => e.role === "assistant");
          const assistantNumber = conversation.slice(0,conversationIndex+1).filter(e => e.role === "assistant").length - 1;
          if(historyAssistant[assistantNumber]) {historyAssistant[assistantNumber].text = result.answer;historyAssistant[assistantNumber].model=responder;}
          updateChatAfterResponse();
        }
        if(result.active_model) currentModel = result.active_model;
      }
      status.textContent = "UnifiedAI can make mistakes.";
    }catch(e){
      status.textContent = "Regenerate failed.";
      console.error(e);
    }finally{
      regenBtn.disabled = false;
    }
  });

  actions.append(copyBtn, likeBtn, downloadBtn, regenBtn);
  row.appendChild(actions);
  chatInner.appendChild(row);
  scrollToBottom();
  return row;
}

// Any file can be selected. Only the formats supported by the server are read.
// Keep requests below typical serverless body limits (base64 adds ~33%).
const MAX_FILE_BYTES = 2 * 1024 * 1024;
const MAX_TOTAL_BYTES = 3 * 1024 * 1024;
const MAX_FILES = 4;

function refreshAttachments(){
  attachmentPreview.replaceChildren();
  attachmentPreview.classList.toggle("show", pendingFiles.length > 0);
  for(const [index, file] of pendingFiles.entries()){
    const item = document.createElement("div");
    item.className = "file-chip";
    if(file.preview){
      const thumbnail = document.createElement("img");
      thumbnail.src = file.preview;
      thumbnail.alt = file.name;
      item.appendChild(thumbnail);
    }
    const title = document.createElement("span");
    title.textContent = file.name + " · " + Math.ceil(file.size / 1024) + " KB";
    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "file-remove";
    remove.textContent = "×";
    remove.title = "إزالة الملف";
    remove.addEventListener("click",()=>{
      pendingFiles.splice(index,1);
      refreshAttachments();
    });
    item.append(title,remove);
    attachmentPreview.appendChild(item);
  }
}

attachButton.addEventListener("click",()=>imageInput.click());
imageInput.addEventListener("change", async ()=>{
  const selected = [...imageInput.files];
  imageInput.value = "";
  for(const file of selected){
    if(pendingFiles.length >= MAX_FILES){
      alert("الحد الأقصى 4 ملفات لكل رسالة."); break;
    }
    if(!file.size || file.size > MAX_FILE_BYTES){
      alert("الملف " + file.name + " يجب ألا يتجاوز 2 ميجابايت."); continue;
    }
    const total = pendingFiles.reduce((sum,f)=>sum+f.size,0);
    if(total + file.size > MAX_TOTAL_BYTES){
      alert("مجموع الملفات يجب ألا يتجاوز 3 ميجابايت."); break;
    }
    try{
      const dataUrl = await new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = ()=>resolve(String(reader.result));
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const isImage = /^image\/(?:png|jpeg|webp)$/.test(file.type);
      pendingFiles.push({
        name: file.name,
        mime_type: file.type || "application/octet-stream",
        size: file.size,
        data: dataUrl.split(",")[1],
        preview: isImage ? dataUrl : null
      });
    }catch{
      alert("تعذّر قراءة الملف: " + file.name);
    }
  }
  refreshAttachments();
});

function wantsImageGeneration(text){
  const t = String(text || "").normalize("NFKC").replace(/[\u064b-\u065f]/g, "").toLowerCase();
  const image = /(?:صوره|صورة|صور|بوستر|شعار|رسم|خلفية|تصميم|image|picture|photo|poster|logo|wallpaper)/i;
  const create = /(?:انشئ|أنشئ|انشى|أنشى|أنشء|انشاء|إنشاء|أنش|اصنع|صمم|صمّم|ارسم|سوي|سوّي|سوى|ابي|أبي|ابغى|أبغى|ولد|ولّد|generate|create|make|draw|design)/i;
  return image.test(t) && create.test(t) && !/(?:كيف|طريقة|اشرح|شرح|why|how to)/i.test(t.slice(0, 12));
}

async function callBackend(payload){
  const action = payload.action || "chat";
  const response = await fetch(`${API}?action=${encodeURIComponent(action)}`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload.body)
  });
  const data = await response.json();
  if(!response.ok || !data.success) throw new Error([data.error || "AI request failed", ...(Array.isArray(data.failures) ? data.failures.map(x => typeof x === "string" ? x : x.reason) : [])].filter(Boolean).join(" | "));
  return data;
}

chatForm.addEventListener("submit",async event=>{
  event.preventDefault();
  let message = messageInput.value.trim();
  if(!message && !pendingFiles.length) return;
  if(sendButton.disabled) return;
  if(!message && pendingFiles.length) message = "حلّل الملفات المرفقة واشرح محتواها.";

  const attachmentsForTurn = pendingFiles.map(f=>({...f}));
  const userRow = addUserMessage(message, attachmentsForTurn);
  const submittedChatId = activeChatId;

  messageInput.value = "";
  messageInput.style.height = "auto";
  pendingFiles = [];
  imageInput.value = "";
  refreshAttachments();
  sendButton.disabled = true;
  status.textContent = "UnifiedAI is thinking...";

  const pendingConversation = [
    ...conversation,
    {role:"user",content:message}
  ];

  const generatingImage = attachmentsForTurn.length === 0 && (imageMode || wantsImageGeneration(message));
  if(generatingImage){ status.textContent = "UnifiedAI is generating an image..."; }
  const requestPayload = generatingImage ? {
    action:"generate-image",
    body:{prompt:message}
  } : {
    action:"chat",
    body:{
      current_model:currentModel,
      requested_model:requestedModel,
      messages:pendingConversation,
      attachments: attachmentsForTurn.map(file=>({
        name:file.name,
        mime_type:file.mime_type,
        size:file.size,
        data:file.data
      }))
    }
  };

  const thinking = addThinking();

  try{
    const data = await callBackend(requestPayload);
    thinking.remove();

    if(data.type === "image"){
      historyEntries.push({role:"user",text:message,names:attachmentsForTurn.map(f=>f.name)});
      historyEntries.push({role:"assistant",text:data.answer||"",names:[],imageLost:true,model:respondingModel(data)});
      addAssistantMessage({
        text:data.answer || "",
        imageUrl:data.image_data_url,
        model:respondingModel(data),
        regeneratePayload:requestPayload
      });
    }else{
      // Preserve extracted file context across subsequent model handoffs.
      if(data.attachment_context){
        pendingConversation[pendingConversation.length-1].content = data.attachment_context;
      }
      conversation = pendingConversation;
      conversation.push({role:"assistant",content:data.answer});
      historyEntries.push({role:"user",text:message,names:attachmentsForTurn.map(f=>f.name)});
      historyEntries.push({role:"assistant",text:data.answer,names:[],imageLost:false,model:respondingModel(data)});
      currentModel = data.active_model || currentModel;
      const assistantIndex = conversation.length - 1;
      addAssistantMessage({
        text:data.answer,
        model:respondingModel(data),
        regeneratePayload:requestPayload,
        conversationIndex:assistantIndex
      });
    }

    if(submittedChatId === activeChatId) updateChatAfterResponse();
    status.textContent = "UnifiedAI can make mistakes.";
    console.log("UnifiedAI Router:",data);
  }catch(error){
    thinking.remove();
    userRow.remove();
    messageInput.value = message;
    pendingFiles = attachmentsForTurn;
    refreshAttachments();
    status.textContent = "Request failed: " + error.message;
    console.error("UnifiedAI Error:",error.message);
  }finally{
    sendButton.disabled = false;
    messageInput.focus();
    scrollToBottom();
  }
});

function createId(){ return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2); }
function cleanChat(chat){
  if(!chat || typeof chat.id !== "string" || !Array.isArray(chat.entries)) return null;
  return {
    id:chat.id,
    title: String(chat.title || "محادثة جديدة").slice(0,90),
    pinned: Boolean(chat.pinned),
    updated: Number(chat.updated) || Date.now(),
    currentModel: typeof chat.currentModel === "string" ? chat.currentModel : null,
    requestedModel: typeof chat.requestedModel === "string" ? chat.requestedModel : null,
    conversation: Array.isArray(chat.conversation) ? chat.conversation.filter(m => m && ["user","assistant"].includes(m.role) && typeof m.content === "string").slice(-30) : [],
    entries:chat.entries.filter(e => e && ["user","assistant"].includes(e.role)).slice(-70).map(e => ({
      role:e.role,text:String(e.text||"").slice(0,12000),
      names:Array.isArray(e.names)?e.names.map(n=>String(n).slice(0,140)).slice(0,4):[],
      imageLost:Boolean(e.imageLost),
      model:e.model && typeof e.model.name === "string" ? {name:e.model.name.slice(0,80),provider:String(e.model.provider||"").slice(0,50)} : null
    }))
  };
}
function persistChats(){
  try{
    // Only text and attachment names are stored. File bytes / generated images are never persisted.
    localStorage.setItem(STORAGE_KEY,JSON.stringify({chats:chats.slice(0,35),activeChatId}));
    return true;
  }catch(e){
    status.textContent = "تعذّر حفظ المحادثة محليًا. صدّر نسخة من الإعدادات أو وفر مساحة للمتصفح.";

  const query=chatSearchInput.value.trim().toLowerCase();
  const sorted=[...chats].sort((a,b)=>Number(b.pinned)-Number(a.pinned) || b.updated-a.updated);
  const visible=sorted.filter(c=>c.title.toLowerCase().includes(query));
  if(!visible.length){const empty=document.createElement("div");empty.className="chat-empty";empty.textContent=tr(query?"ما لقيت محادثة بهذا الاسم.":"ما عندك محادثات بعد.");chatList.append(empty);return;}
  for(const c of visible){
    const item=document.createElement("div");item.className="chat-entry"+(c.id===activeChatId?" active":"");
    const select=document.createElement("button");select.className="chat-select";select.type="button";
    select.textContent=(c.pinned?"📌 ":"")+c.title;select.title=c.title;
    select.addEventListener("click",()=>activateChat(c.id));
    const options=document.createElement("button");options.className="chat-option";options.type="button";options.title=tr("إجراءات المحادثة");options.textContent="⋯";
    options.addEventListener("click",()=>openChatOptions(c.id));
    item.append(select,options);chatList.append(item);
  }
}
function applyModelSelection(){
  const match=[...modelMenu.querySelectorAll("button[data-model]")].find(b=>b.dataset.model===requestedModel);
  modelButton.textContent=match?match.textContent.trim():"Auto";
  if(!match)requestedModel=null;
}
function drawChat(){
  chatInner.replaceChildren();
  const intro=document.createElement("div");intro.className="welcome";intro.id="welcome";
  const heading=document.createElement("h1");heading.textContent=uiText("كيف أقدر أساعدك اليوم؟","How can I help you today?");intro.append(heading);chatInner.append(intro);
  welcome = intro;
  intro.style.display=historyEntries.length?"none":"flex";
  for(let i=0;i<historyEntries.length;i++){
    const e=historyEntries[i];
    if(e.role==="user") addUserMessage(e.text,(e.names||[]).map(name=>({name,preview:null})));
    else addAssistantMessage({text:e.imageLost?"[تم إنشاء صورة سابقًا؛ الصورة نفسها غير محفوظة محليًا]":e.text,model:e.model,conversationIndex:null,regeneratePayload:null});
  }
  scrollToBottom();
}
function activateChat(id){
  if(sendButton.disabled){status.textContent="انتظر انتهاء الطلب الحالي قبل تبديل المحادثة.";return;}
  snapshotActive();
  const c=chats.find(x=>x.id===id);if(!c)return;
  activeChatId=id;conversation=c.conversation.map(m=>({...m}));
  historyEntries=c.entries.map(e=>({...e}));currentModel=c.currentModel;requestedModel=c.requestedModel;
  pendingFiles=[];refreshAttachments();messageInput.value="";messageInput.style.height="auto";
  applyModelSelection();drawChat();renderChatList();persistChats();setSidebarOpen(false);
}
function createChat(){
  if(sendButton.disabled){status.textContent="انتظر انتهاء الرد قبل فتح محادثة جديدة.";return;}
  snapshotActive();
  const c={id:createId(),title:"محادثة جديدة",pinned:false,updated:Date.now(),currentModel:null,requestedModel:null,conversation:[],entries:[]};
  chats.unshift(c);activeChatId=c.id;conversation=[];historyEntries=[];currentModel=null;requestedModel=null;
  pendingFiles=[];refreshAttachments();messageInput.value="";messageInput.style.height="auto";applyModelSelection();
  drawChat();renderChatList();persistChats();setSidebarOpen(false);messageInput.focus();
}
function updateChatAfterResponse(){
  const c=chats.find(x=>x.id===activeChatId);if(!c)return;
  if(c.title==="محادثة جديدة"){
    const first=historyEntries.find(e=>e.role==="user");
    if(first)c.title=(first.text||first.names.join(" ")||"محادثة جديدة").replace(/\s+/g," ").slice(0,48);
  }
  snapshotActive();renderChatList();persistChats();
}
function openChatOptions(id){
  if(sendButton.disabled)return;
  const c=chats.find(x=>x.id===id);if(!c)return;
  openDialog("إدارة المحادثة");
  const desc=document.createElement("p");desc.textContent=c.title;dialogContent.append(desc);
  makeDialogButton(c.pinned?"إلغاء التثبيت":"📌 تثبيت",()=>{c.pinned=!c.pinned;persistChats();renderChatList();closeDialog();});
  makeDialogButton("إعادة تسمية",()=>{
    openDialog("إعادة تسمية المحادثة");
    const input=document.createElement("input");input.type="text";input.maxLength=90;input.value=c.title;dialogContent.append(input);
    makeDialogButton("حفظ",()=>{const n=input.value.trim();if(n){c.title=n;persistChats();renderChatList();}closeDialog();},"primary");
    makeDialogButton("إلغاء",closeDialog);input.focus();
  });
  makeDialogButton("حذف",()=>{
    openDialog("حذف المحادثة؟");const p=document.createElement("p");p.textContent=tr("سيُحذف سجل هذه المحادثة من هذا المتصفح فقط.");dialogContent.append(p);
    makeDialogButton("حذف نهائي",()=>{
      chats=chats.filter(x=>x.id!==id);if(activeChatId===id){activeChatId=null;conversation=[];historyEntries=[];currentModel=null;requestedModel=null;}
      closeDialog();if(!chats.length)createChat();else if(!activeChatId)activateChat(chats[0].id);
      renderChatList();persistChats();
    },"danger");makeDialogButton("إلغاء",closeDialog);
  },"danger");
  makeDialogButton("إغلاق",closeDialog);
}

 openDialog("الإعدادات");
 const p=document.createElement("p");

 for(const [value,label] of [["ar",tr("العربية")],["en",tr("الإنجليزية")]]){
   const option=document.createElement("option");option.value=value;option.textContent=label;languageSelect.append(option);
 }

 const label=document.createElement("label");label.className="settings-label";label.textContent=tr("حجم خط المحادثة");dialogContent.append(label);
 const slider=document.createElement("input");slider.type="range";slider.min="16";slider.max="22";slider.value=(Number(localStorage.getItem("unifiedai.font.v1"))>=16 ? localStorage.getItem("unifiedai.font.v1") : "17");dialogContent.append(slider);
 const amount=document.createElement("p");amount.textContent=slider.value+"px";dialogContent.append(amount);
 slider.addEventListener("input",()=>{document.documentElement.style.setProperty("--chat-font-size",slider.value+"px");amount.textContent=slider.value+"px";try{localStorage.setItem("unifiedai.font.v1",slider.value);}catch{}});
 makeDialogButton("تصدير محادثاتك JSON",()=>{

   downloadData(url,"UnifiedAI-guest-chats.json");setTimeout(()=>URL.revokeObjectURL(url),1000);
 });

}

function openSignIn(){
  openDialog("تسجيل الدخول");
  const p=document.createElement("p");p.textContent=tr("حاليًا أنت تستخدم وضع الضيف. تسجيل الدخول الفعلي وحفظ المحادثات على حسابك يحتاجان ربط Supabase Auth وقاعدة بيانات؛ لم نفعلهما بعد، ولن نطلب منك كلمة مرور في واجهة تجريبية.");dialogContent.append(p);
  makeDialogButton("متابعة كضيف",closeDialog,"primary");

document.getElementById("newChatButton").addEventListener("click",createChat);
document.getElementById("searchChatsButton").addEventListener("click",()=>{chatSearchInput.classList.toggle("show");if(chatSearchInput.classList.contains("show"))chatSearchInput.focus();else{chatSearchInput.value="";renderChatList();}});
chatSearchInput.addEventListener("input",renderChatList);
document.getElementById("settingsButton").addEventListener("click",openSettings);
document.getElementById("signInButton").addEventListener("click",openSignIn);
try{
 const stored=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
 if(stored&&Array.isArray(stored.chats)){chats=stored.chats.map(cleanChat).filter(Boolean).slice(0,35);activeChatId=stored.activeChatId;}
 const fontsize=Number(localStorage.getItem("unifiedai.font.v1"));
 if(fontsize>=16&&fontsize<=22)document.documentElement.style.setProperty("--chat-font-size",fontsize+"px");
}catch(e){console.warn("Local guest history cannot be restored:",e);}
applyTheme(uiTheme);
if(!chats.length){createChat();}else{
  const restoreId = chats.some(c=>c.id===activeChatId) ? activeChatId : chats[0].id;
  activeChatId = null; // Never overwrite restored history with a fresh empty conversation.
  activateChat(restoreId);
}

function demoClear(){demoTimers.forEach(clearTimeout);demoTimers=[];}
function demoLater(fn,ms){demoTimers.push(setTimeout(fn,ms));}
function demoScroll(){requestAnimationFrame(()=>{demoChat.scrollTop=demoChat.scrollHeight;});}
function demoTypeInto(el,text,delay=22,chunk=2,onDone){let i=0;const tick=()=>{if(!demoRunning)return;const next=Math.min(i+chunk,text.length);el.value+=text.slice(i,next);i=next;el.style.height="auto";el.style.height=Math.min(el.scrollHeight,150)+"px";if(i<text.length)demoLater(tick,delay);else onDone&&demoLater(onDone,450);};tick();}
function demoTypeText(el,text,delay=17,chunk=3,onDone){let i=0;const glyphs=typeof Intl.Segmenter==="function"?Array.from(new Intl.Segmenter(uiLanguage==="ar"?"ar":"en",{granularity:"grapheme"}).segment(text),part=>part.segment):Array.from(text);const content=document.createTextNode("");const cursor=document.createElement("span");cursor.className="demo-cursor";cursor.setAttribute("aria-hidden","true");el.replaceChildren(content,cursor);el.dir=uiLanguage==="ar"?"rtl":"ltr";const tick=()=>{if(!demoRunning)return;i=Math.min(i+chunk,glyphs.length);content.textContent=glyphs.slice(0,i).join("");demoScroll();if(i<glyphs.length)demoLater(tick,delay);else{cursor.remove();onDone&&demoLater(onDone,650);}};tick();}

function demoAddAI(label){const row=document.createElement("div");row.className="demo-row ai";const name=document.createElement("div");name.className="demo-model-label "+(label==="ChatGPT"?"chatgpt":label==="Gemini"?"gemini":"");name.textContent=label;const bubble=document.createElement("div");bubble.className="demo-bubble";bubble.dir=uiLanguage==="ar"?"rtl":"ltr";row.append(name,bubble);demoChatInner.append(row);demoScroll();return bubble;}

function demoReset(){demoClear();demoRunning=false;demoChatInner.replaceChildren();demoWelcome.className="demo-welcome";const t=demoStrings();const h=document.createElement("h1");h.textContent="Demo";const start=document.createElement("button");start.className="demo-start";start.id="demoStart";start.type="button";start.textContent=t.start;start.addEventListener("click",demoPlay,{once:true});demoWelcome.replaceChildren(h,start);demoChatInner.append(demoWelcome);demoInput.value="";demoInput.style.height="auto";demoInput.placeholder=t.placeholder;document.getElementById("demoClose").textContent=t.exit;document.getElementById("demoDisclaimer").textContent=t.note;}
